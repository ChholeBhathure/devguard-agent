[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard"
version = "0.1.0"
description = "AI-assisted Python code security analysis application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic>=2.0",
    "python-dotenv",
    "reportlab>=4.0",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
